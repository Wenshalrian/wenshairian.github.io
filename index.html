    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-gold: #f59e0b;

            --whatsapp-green: #10b981;
            --text-main: #f3f4f6;

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; }
        
        .emergency-banner {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 2px 10px rgba(220, 38, 38, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        header {
            background: rgba(11, 15, 25, 0.95);

            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { color: var(--accent-gold); font-size: 1.6rem; font-weight: 800; }
        header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .hero {
            padding: 40px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
        }
        .hero h2 { color: #ffffff; font-size: 1.9rem; margin-bottom: 15px; }
        .hero p { color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin: 0 auto 30px; }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-call { background: linear-gradient(135deg, var(--accent-gold), var(--accent-hover)); color: #000; }
        .btn-whatsapp { background: linear-gradient(135deg, var(--whatsapp-green), #059669); }

            max-width: 800px;
            margin: 0 auto;
        }
